experiment:
  name: joint_cnn_mask_dual
  seed: 42
  device: cpu
  gpu_index: 0
  mlflow:
    tracking_uri: http://127.0.0.1:5000
    experiment_name: csi_compression
    log_every_n_iters: 10

data:
  format: npz
  train_path: /path/to/train_dataset.npz
  val_path: /path/to/valid_dataset.npz
  max_subband: 13
  max_port: 32
  layout: cnn
  batch_size: 16
  num_workers: 0

model:
  # Latent masking: for each input the decoder is run TWICE — once with the full
  # quantized latent and once with the trailing 50% zeroed — and the total loss is
  # a weighted sum of both reconstruction losses. Requires `dual_one_minus_sgcs`
  # as the loss term (see below); full/half weights are configured there.
  latent_mask:
    mode: dual        # "full" | "half" | "dual" | "random"
    mask_ratio: 0.5   # fraction of latent elements zeroed for the "half" pass
  encoder:
    blocks:
      - { name: cnn_block, channels: 16, kernel: 3 }
      - { name: cnn_block, channels: 32, kernel: 3 }
      - { name: linear_proj, out_dim: 64, activation: relu }
      - { name: activation, activation: tanh }
  decoder:
    blocks:
      - { name: linear_proj, out_dim: 128, activation: relu }
      - { name: reshape_head, max_subband: "${data.max_subband}", max_port: "${data.max_port}" }
    pretrained_path: null

quantizer:
  type: uniform
  bits: 2
  value_range: [-1.0, 1.0]    # decoder input range; quantization levels defined here
  unit_spaced: true
  grad: ste
  # encoder_value_range: [-1.0, 1.0]  # optional; encoder output range (e.g. tanh → [-1,1],
  #                                    # sigmoid → [0,1]). When set, a linear transform maps
  #                                    # encoder output → value_range before quantization.

training:
  mode: joint
  epochs: 3
  optimizer: { name: adam, lr: 1.0e-3 }
  scheduler: { name: cosine, T_max: 3 }
  val_every_n_epochs: 1
  best_metric: { name: loss/total, mode: min }  # dual mode tracks both full+half paths via the combined loss
  amp:
    enabled: false
  compile:
    enabled: false

loss:
  terms:
    # dual_one_minus_sgcs reads both pred_pack["recon"] (full latent) and
    # pred_pack["recon_half"] (masked latent) and returns:
    #   full_weight * (1 - SGCS_full) + half_weight * (1 - SGCS_half)
    - name: dual_one_minus_sgcs
      weight: 1.0
      params:
        full_weight: 0.5
        half_weight: 0.5
