experiment:
  name: joint_cnn_mask_random
  seed: 42
  device: cpu
  gpu_index: 0
  mlflow:
    tracking_uri: http://127.0.0.1:5000
    experiment_name: csi_compression
    log_every_n_iters: 10

data:
  format: npz
  train_path: /path/to/train_dataset.npz
  val_path: /path/to/valid_dataset.npz
  max_subband: 13
  max_port: 32
  layout: cnn
  batch_size: 16
  num_workers: 0

model:
  # Latent masking: each sample in the batch independently has a 50% chance of
  # having the trailing mask_ratio fraction of its quantized latent zeroed out.
  # Acts as a data-augmentation-style robustness regulariser during training.
  latent_mask:
    mode: random      # "full" | "half" | "dual" | "random"
    mask_ratio: 0.5   # fraction of latent elements zeroed when masking is applied
  encoder:
    blocks:
      - { name: cnn_block, channels: 16, kernel: 3 }
      - { name: cnn_block, channels: 32, kernel: 3 }
      - { name: linear_proj, out_dim: 64, activation: relu }
      - { name: activation, activation: tanh }
  decoder:
    blocks:
      - { name: linear_proj, out_dim: 128, activation: relu }
      - { name: reshape_head, max_subband: "${data.max_subband}", max_port: "${data.max_port}" }
    pretrained_path: null

quantizer:
  type: uniform
  bits: 2
  value_range: [-1.0, 1.0]    # decoder input range; quantization levels defined here
  unit_spaced: true
  grad: ste
  # encoder_value_range: [-1.0, 1.0]  # optional; encoder output range (e.g. tanh → [-1,1],
  #                                    # sigmoid → [0,1]). When set, a linear transform maps
  #                                    # encoder output → value_range before quantization.

training:
  mode: joint
  epochs: 3
  optimizer: { name: adam, lr: 1.0e-3 }
  scheduler: { name: cosine, T_max: 3 }
  val_every_n_epochs: 1
  best_metric: { name: sgcs, mode: max }
  amp:
    enabled: false
  compile:
    enabled: false

loss:
  terms:
    - { name: one_minus_sgcs, weight: 1.0 }
