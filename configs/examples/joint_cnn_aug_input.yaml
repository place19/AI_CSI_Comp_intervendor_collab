experiment:
  name: joint_cnn_aug_input_smoke
  seed: 42
  device: cpu
  gpu_index: 0
  mlflow:
    tracking_uri: http://127.0.0.1:5000
    experiment_name: csi_compression
    log_every_n_iters: 10

data:
  # Single-file npz with keys D (int8 (N, S, P, 2)), Z (pre-quant latent),
  # Zq (post-quant latent).
  format: npz
  train_path: /path/to/train_dataset.npz
  val_path: /path/to/valid_dataset.npz
  # Augmented (UE-condition) CSI used as the ENCODER INPUT. The reconstruction
  # target stays the clean CSI from train_path/val_path, so this trains an
  # "augmented CSI -> target CSI" autoencoder. Same format + dataset_args as the
  # target datasets; samples must be index-aligned (aug[i] pairs with target[i]).
  # Remove these two keys to fall back to the default "target -> target" training.
  aug_train_path: /path/to/train_dataset_augmented.npz
  aug_val_path: /path/to/valid_dataset_augmented.npz
  # Phase augmentation: scale the augmented ENCODER INPUT per channel (real =
  # D[...,0], imag = D[...,1]). scale_real/scale_imag override the single `scale`
  # for that channel only; an unset channel falls back to `scale`. These apply to
  # the augmented input ONLY — the reconstruction target keeps the base `scale`
  # below — and are a no-op without aug_*_path. Put them in aug_dataset_args to
  # scope them to the aug build, or in dataset_args (they're still stripped from
  # the target/non-aug build). Each value is a number OR a hex string parsed as the
  # little-endian IEEE-754 float64 bit pattern (e.g. 1/128 == "0x000000000000803F").
  # aug_dataset_args:
  #   scale_real: "0x000000000000803F"   # hex float64 = 1/128 = 0.0078125
  #   scale_imag: 0.0078125              # or a plain number
  # dataset_args:
  #   scale: 0.0078125                   # base scale for target + non-aug input
  #   target_offset: 0.00390625          # = 1/256 (3GPP/HW bin midpoint); 0.0 to disable
  max_subband: 13
  max_port: 32
  layout: cnn
  batch_size: 16
  num_workers: 0

model:
  encoder:
    blocks:
      - { name: cnn_block, channels: 16, kernel: 3 }
      - { name: cnn_block, channels: 32, kernel: 3 }
      - { name: linear_proj, out_dim: 64, activation: relu }
      - { name: activation, activation: tanh }
  decoder:
    blocks:
      - { name: linear_proj, out_dim: 128, activation: relu }
      - { name: reshape_head, max_subband: "${data.max_subband}", max_port: "${data.max_port}" }
    pretrained_path: null

quantizer:
  type: uniform
  bits: 2
  value_range: [-1.0, 1.0]
  unit_spaced: true
  grad: ste

training:
  mode: joint
  epochs: 3
  optimizer: { name: adam, lr: 1.0e-3 }
  scheduler: { name: cosine, T_max: 3 }
  val_every_n_epochs: 1
  best_metric: { name: sgcs, mode: max }
  amp:
    enabled: false
  compile:
    enabled: false

loss:
  terms:
    - { name: one_minus_sgcs, weight: 1.0 }
